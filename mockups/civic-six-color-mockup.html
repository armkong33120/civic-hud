<div id="civic-six-color-mockup">
<style>
#civic-six-color-mockup{font-family:Tahoma,Thonburi,sans-serif;--hud-scale:1.5}
#civic-six-color-mockup .hud-stage{min-height:530px;padding:20px 0;display:flex;justify-content:center}
#civic-six-color-mockup .hud-shell{width:360px;height:480px;position:relative}
#civic-six-color-mockup .hud-screen{width:240px;height:320px;transform:scale(var(--hud-scale));transform-origin:top left;position:relative;overflow:hidden;font-size:16px;line-height:1.4;background:var(--hud-bg);color:var(--hud-text);font-variant-numeric:tabular-nums;touch-action:pan-y;user-select:none}
#civic-six-color-mockup .hud-head{height:32px;background:var(--hud-head);display:flex;align-items:center;justify-content:space-between;padding:0 7px;border-bottom:1px solid var(--hud-line)}
#civic-six-color-mockup .hud-obd{font-size:11px;color:var(--hud-green)}
#civic-six-color-mockup .hud-volts{font-size:11px;color:var(--hud-secondary)}
#civic-six-color-mockup .hud-odo{font-size:14px;color:var(--hud-text)}
#civic-six-color-mockup .hud-list{padding:0 6px}
#civic-six-color-mockup .hud-item{width:228px;height:48px;display:block;margin:0 0 4px;padding:3px 7px;text-align:left;font:inherit;background:var(--hud-card);color:var(--hud-text);border:1px solid var(--hud-line);border-left:3px solid var(--hud-state);border-radius:3px}
#civic-six-color-mockup .hud-title{display:block;font-size:15px;line-height:23px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#civic-six-color-mockup .hud-detail{display:flex;justify-content:space-between;align-items:center;height:17px;gap:4px}
#civic-six-color-mockup .hud-distance{font-size:12px;color:var(--hud-state);white-space:nowrap}
#civic-six-color-mockup .hud-track{width:82px;height:7px;background:var(--hud-track);flex-shrink:0;overflow:hidden}
#civic-six-color-mockup .hud-fill{display:block;height:100%;background:var(--hud-state);transition:width .2s ease}
#civic-six-color-mockup [data-night] .hud-item{border:0;border-bottom:1px solid var(--hud-line);border-left:3px solid var(--hud-state);border-radius:0;background:var(--hud-bg)}
#civic-six-color-mockup [data-night] .hud-track{height:5px}
#civic-six-color-mockup .hud-footer{position:absolute;bottom:0;left:0;width:240px;height:28px;background:var(--hud-head);display:flex;border-top:1px solid var(--hud-line)}
#civic-six-color-mockup .hud-footer button{flex:1;border:0;background:var(--hud-head);color:var(--hud-text);font-family:inherit;font-size:11px;padding:0}
#civic-six-color-mockup .hud-footer button:disabled{color:var(--hud-secondary)}
#civic-six-color-mockup .hud-footer .hud-page{font-size:13px}
#civic-six-color-mockup .hud-modal{padding:10px 14px;font-size:13px}
#civic-six-color-mockup .hud-modal h3{font-size:16px;margin:0 0 14px;line-height:1.4;font-weight:500}
#civic-six-color-mockup .hud-modal p{font-size:13px;line-height:25px;margin:0;color:var(--hud-secondary)}
#civic-six-color-mockup .hud-modal strong{font-weight:500;color:var(--hud-text)}
#civic-six-color-mockup .hud-next{color:var(--hud-green)!important}
#civic-six-color-mockup .hud-slide{position:absolute;left:18px;top:236px;width:204px;height:36px;background:var(--hud-track);border:1px solid var(--hud-green);border-radius:18px;overflow:hidden;touch-action:none;cursor:grab}
#civic-six-color-mockup .hud-slide-label{position:absolute;left:41px;right:3px;top:0;line-height:34px;font-size:12px;text-align:center;color:var(--hud-text);pointer-events:none}
#civic-six-color-mockup .hud-thumb{position:absolute;left:2px;top:2px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--hud-green);color:var(--hud-knob-text);font-size:10px;pointer-events:none}
#civic-six-color-mockup .hud-slide.hud-ready .hud-thumb{background:var(--hud-yellow);color:#000000}
#civic-six-color-mockup .hud-swatches{display:grid;grid-template-columns:90px repeat(8,minmax(0,1fr));gap:5px;align-items:center;max-width:540px;margin:16px auto;font-size:12px}
#civic-six-color-mockup .hud-chip{height:24px;display:flex;align-items:center;justify-content:center;font-size:11px;border:1px solid #929292}
#civic-six-color-mockup .hud-palette-label{color:light-dark(#242424,#dbdbdb)}
@media(max-width:400px){#civic-six-color-mockup{--hud-scale:1.25}#civic-six-color-mockup .hud-shell{width:300px;height:400px}#civic-six-color-mockup .hud-stage{min-height:450px}#civic-six-color-mockup .hud-swatches{grid-template-columns:64px repeat(8,minmax(0,1fr));gap:3px}}
@media(prefers-reduced-motion:reduce){#civic-six-color-mockup .hud-fill{transition:none}}
</style>
<div class="viz-carousel viz-dotted-background" aria-label="Civic HUD กลางวันและกลางคืน" data-previous-label="แบบก่อนหน้า" data-next-label="แบบถัดไป">
<section data-variant="กลางวัน" aria-label="แบบกลางวัน"><div class="hud-stage"><div class="hud-shell"><div class="hud-screen" data-theme="day" aria-label="จอ 240 คูณ 320 แบบกลางวัน"></div></div></div></section>
<section data-variant="กลางคืน" aria-label="แบบกลางคืน" hidden><div class="hud-stage"><div class="hud-shell"><div class="hud-screen" data-theme="night" data-night aria-label="จอ 240 คูณ 320 แบบกลางคืน"></div></div></div></section>
</div>
<div class="hud-swatches" aria-label="ระดับสี 0 ถึง 7"></div>
<div class="text-small" style="text-align:center" aria-live="polite" data-result>ข้อมูลระยะเป็นตัวอย่าง • ไม่ได้บันทึกลงบอร์ด</div>
<script>
(()=>{
const root=document.getElementById('civic-six-color-mockup');
const shades={neutral:['#000000','#242424','#494949','#6d6d6d','#929292','#b6b6b6','#dbdbdb','#ffffff'],green:['#000000','#002400','#004900','#006d00','#009200','#00b600','#00db00','#00ff00'],yellow:['#000000','#242400','#494900','#6d6d00','#929200','#b6b600','#dbdb00','#ffff00'],red:['#000000','#240000','#490000','#6d0000','#920000','#b60000','#db0000','#ff0000']};
const defaults={day:{green:4,yellow:3,red:5,text:0},night:{green:5,yellow:5,red:6,text:6}};
const saved=window.openai?.widgetState?.privateContent;
const levels=JSON.parse(JSON.stringify(defaults));
if(saved?.levels)for(const mode of ['day','night'])for(const key of ['green','yellow','red','text']){const v=saved.levels[mode]?.[key];if(Number.isInteger(v)&&v>=0&&v<=7)levels[mode][key]=v;}
const state={day:{page:0,active:null},night:{page:0,active:null}};
const items=[['น้ำมันเครื่อง + กรอง',10000,-500],['น้ำมันเกียร์ CVT',25000,2500],['สลับยาง & ถ่วงล้อ',10000,7000],['กรองอากาศเครื่องยนต์',20000,12000],['กรองแอร์ห้องโดยสาร',15000,12000],['น้ำมันเบรก',40000,14000],['ผ้าเบรก',40000,20000],['หัวเทียน',60000,35000],['แบตเตอรี่',30000,15000],['น้ำยาหม้อน้ำ',100000,50000],['ภาษี & พ.ร.บ.',10000,7500],['กรองแก๊ส LPG',20000,9000],['เช็ครั่ว / จูนแก๊ส',10000,8000],['เช็คระยะวาล์ว LPG',40000,22000]].map(([name,interval,left])=>({name,interval,left}));
const odo=298867;
const format=n=>n.toLocaleString('en-US');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){window.openai?.setWidgetState?.({modelContent:{colors:levels},privateContent:{levels}})?.catch(()=>{});}
function apply(mode){const el=root.querySelector('[data-theme="'+mode+'"]'),l=levels[mode],night=mode==='night';const v={'bg':shades.neutral[night?0:6],'head':shades.neutral[night?0:7],'card':shades.neutral[night?0:7],'text':shades.neutral[l.text],'secondary':shades.neutral[night?5:3],'line':shades.neutral[night?2:5],'track':shades.neutral[night?2:6],'green':shades.green[l.green],'yellow':shades.yellow[l.yellow],'red':shades.red[l.red],'knob-text':shades.neutral[night?0:7]};for(const [k,c]of Object.entries(v))el.style.setProperty('--hud-'+k,c);}
function render(mode){const el=root.querySelector('[data-theme="'+mode+'"]'),s=state[mode];let html='<div class="hud-head"><span class="hud-obd">OBD OK</span><span class="hud-volts">14.3V</span><span class="hud-odo">'+odo+' km</span></div>';
if(s.active===null){html+='<div class="hud-list">';items.slice(s.page*5,s.page*5+5).forEach((it,j)=>{const type=it.left<=0?'red':it.left/it.interval<=.15?'yellow':'green',pct=Math.max(0,Math.min(100,(1-it.left/it.interval)*100)),text=it.left<0?'เกิน '+format(-it.left)+' km':it.left===0?'ถึงกำหนดเปลี่ยน':'เหลือ '+format(it.left)+' km';html+='<button type="button" class="hud-item cursor-interaction" data-item="'+(s.page*5+j)+'" style="--hud-state:var(--hud-'+type+')" data-tooltip="'+esc(it.name)+'"><span class="hud-title">'+esc(it.name)+'</span><span class="hud-detail"><span class="hud-distance">'+text+'</span><span class="hud-track"><span class="hud-fill" style="width:'+pct+'%"></span></span></span></button>'});html+='</div><div class="hud-footer"><button type="button" class="cursor-interaction" data-step="-1" '+(s.page===0?'disabled':'')+'>ก่อนหน้า</button><button type="button" class="hud-page" disabled>'+(s.page+1)+' / 3</button><button type="button" class="cursor-interaction" data-step="1" '+(s.page===2?'disabled':'')+'>ถัดไป</button></div>';}else{const it=items[s.active],last=odo-it.interval+it.left;html+='<div class="hud-modal"><h3>'+esc(it.name)+'</h3><p>ไมล์ครั้งก่อน: <strong>'+format(last)+'</strong></p><p>วิ่งแล้ว: <strong>'+format(odo-last)+' km</strong></p><p>ไมล์ใหม่: <strong>'+format(odo)+'</strong></p><p class="hud-next">รอบหน้า: '+format(odo+it.interval)+' km</p></div><div class="hud-slide" aria-label="รูดเพื่อยืนยันในตัวอย่าง"><span class="hud-slide-label">รูดเพื่อยืนยัน</span><span class="hud-thumb">รูด</span></div><div class="hud-footer"><button type="button" class="cursor-interaction" data-back>กลับ</button></div>';}
el.innerHTML=html;apply(mode);
el.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{s.active=Number(b.dataset.item);render(mode)});
el.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{s.page+=Number(b.dataset.step);render(mode)});
const back=el.querySelector('[data-back]');if(back)back.onclick=()=>{s.active=null;render(mode)};
const slide=el.querySelector('.hud-slide');if(slide){let down=false,start=0,p=0;const thumb=slide.querySelector('.hud-thumb'),label=slide.querySelector('.hud-slide-label');const paint=()=>{thumb.style.left=(2+p*168)+'px';slide.classList.toggle('hud-ready',p>=.85);label.textContent=p>=.85?'ปล่อยเพื่อยืนยัน':'รูดเพื่อยืนยัน';};slide.onpointerdown=e=>{const r=slide.getBoundingClientRect(),x=(e.clientX-r.left)*204/r.width;if(x>65)return;down=true;start=x;p=0;slide.setPointerCapture(e.pointerId);e.preventDefault()};slide.onpointermove=e=>{if(!down)return;const r=slide.getBoundingClientRect(),x=(e.clientX-r.left)*204/r.width,y=(e.clientY-r.top)*36/r.height;p=y<-20||y>56?0:Math.max(0,Math.min(1,(x-start)/(185-start)));paint()};slide.onpointerup=()=>{if(!down)return;down=false;if(p>=.85){const i=s.active;items[i].left=items[i].interval;s.active=null;render('day');render('night');root.querySelector('[data-result]').textContent='ตัวอย่าง: '+items[i].name+' กลับเป็นบาร์เขียว • ไม่ได้บันทึกลงบอร์ด';}else{p=0;paint()}};slide.onpointercancel=()=>{down=false;p=0;paint()};}
}
for(const mode of ['day','night'])render(mode);
const swatches=root.querySelector('.hud-swatches');for(const [key,label]of [['neutral','ดำ–เทา–ขาว'],['green','เขียว'],['yellow','เหลือง'],['red','แดง']]){const lab=document.createElement('span');lab.className='hud-palette-label';lab.textContent=label;swatches.appendChild(lab);shades[key].forEach((color,i)=>{const chip=document.createElement('span');chip.className='hud-chip';chip.style.background=color;chip.style.color=key==='neutral'&&i>=4?'#000000':key==='yellow'&&i>=4?'#000000':'#ffffff';chip.textContent=i;chip.setAttribute('aria-label',label+' ระดับ '+i);swatches.appendChild(chip)});}
if(globalThis.Tweak)for(const mode of ['day','night']){const el=root.querySelector('[data-theme="'+mode+'"]');const tweak=new Tweak({container:el,onChange:()=>{apply(mode);save()}});for(const [key,label]of [['green','ระดับเขียว'],['yellow','ระดับเหลือง'],['red','ระดับแดง'],['text','ระดับตัวหนังสือ']])tweak.addSlider(levels[mode],key,{label,min:key==='text'?0:1,max:7,step:1});}
window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.privateContent?.levels;if(!s)return;for(const mode of ['day','night'])for(const key of ['green','yellow','red','text'])if(Number.isInteger(s[mode]?.[key])&&s[mode][key]>=0&&s[mode][key]<=7)levels[mode][key]=s[mode][key];apply('day');apply('night');});
})();
</script>
</div>
