<div id="civic-bar-progression">
<style>
#civic-bar-progression{font-family:Tahoma,Thonburi,sans-serif;color:light-dark(#242424,#dbdbdb)}
#civic-bar-progression .cb-stage{display:flex;justify-content:center;padding:24px 0}
#civic-bar-progression .cb-panel{width:min(100%,380px);padding:20px;background:#000000;color:#dbdbdb;border-radius:5px}
#civic-bar-progression .cb-name{font-size:18px;line-height:1.5;margin-bottom:12px;font-weight:500}
#civic-bar-progression .cb-value{font-size:16px;line-height:1.6;margin-bottom:10px;font-variant-numeric:tabular-nums}
#civic-bar-progression .cb-track{height:16px;background:#494949;overflow:hidden}
#civic-bar-progression .cb-fill{height:100%;width:0;background:#006d00;transition:width .15s ease}
#civic-bar-progression .cb-phase{margin-top:12px;font-size:13px;line-height:1.5;color:#b6b6b6}
#civic-bar-progression .cb-order{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;font-size:12px;margin:14px 0}
#civic-bar-progression .cb-order span{padding-bottom:4px;border-bottom:3px solid var(--cb-color)}
#civic-bar-progression .cb-flash{animation:cb-warning 1s steps(1,end) infinite}
@keyframes cb-warning{0%,49%{visibility:visible}50%,100%{visibility:hidden}}
@media(prefers-reduced-motion:reduce){#civic-bar-progression .cb-flash{animation:none}#civic-bar-progression .cb-fill{transition:none}}
</style>
<div class="cb-stage"><div class="cb-panel" aria-label="ตัวอย่างแถบบำรุงรักษากลางคืน"><div class="cb-name">น้ำมันเครื่อง + กรอง</div><div class="cb-value" data-left>เหลือ 10,000 กม.</div><div class="cb-track" role="progressbar" aria-label="สัดส่วนระยะที่ใช้ไป" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="cb-fill"></div></div><div class="cb-phase" aria-live="polite">เขียวเข้ม</div></div></div>
<div class="viz-controls"><label class="form-label" style="flex:1">จำลองระยะที่ใช้ไป — รอบตัวอย่าง 10,000 กม.<input class="form-range" type="range" min="0" max="10500" step="100" value="0" aria-label="ระยะที่ใช้ไป"></label></div>
<div class="cb-order"><span style="--cb-color:#006d00">เขียวเข้ม</span><span style="--cb-color:#00ff00">เขียวอ่อน</span><span style="--cb-color:#ffff00">เหลืองอ่อน</span><span style="--cb-color:#929200">เหลืองเข้ม</span><span style="--cb-color:#ff9292">แดงอ่อน</span><span style="--cb-color:#b60000">แดงเข้ม</span></div>
<div class="text-small" style="text-align:center" data-note>เกณฑ์กระพริบ: เหลือไม่เกิน 500 กม. • ช่วงเปลี่ยนสีอื่นเป็นตัวอย่าง</div>
<script>
(()=>{
 const root=document.getElementById('civic-bar-progression'),slider=root.querySelector('input'),fill=root.querySelector('.cb-fill'),track=root.querySelector('.cb-track');
 const green=['#006d00','#009200','#00b600','#00c000','#00d000','#00db00','#00ed00','#00ff00'];
 const yellow=['#ffff00','#eded00','#dbdb00','#c8c800','#b6b600','#aaaa00','#9e9e00','#929200'];
 const red=['#ff9292','#ff7a7a','#ff6262','#ff4949','#ed2424','#db0000','#c80000','#b60000'];
 function draw(){const used=Number(slider.value),left=10000-used,p=used/10000;let phase,color;
 if(p<.60){let index=Math.min(7,Math.floor(p/.60*8));color=green[index];phase=index<4?'เขียวเข้ม':'เขียวอ่อน';}
 else if(p<.85){let index=Math.min(7,Math.floor((p-.60)/.25*8));color=yellow[index];phase=index<4?'เหลืองอ่อน':'เหลืองเข้ม';}
 else{let index=Math.min(7,Math.floor((p-.85)/.10*8));color=red[index];phase=index<4?'แดงอ่อน':'แดงเข้ม';}
 const flash=left<=500;if(flash){color=red[7];phase='แดงเข้ม — กระพริบ';}
 fill.style.width=Math.max(0,Math.min(100,p*100))+'%';fill.style.background=color;fill.classList.toggle('cb-flash',flash);track.setAttribute('aria-valuenow',Math.max(0,Math.min(100,p*100)));
 root.querySelector('[data-left]').textContent=left<0?'เกิน '+(-left).toLocaleString('en-US')+' กม.':left===0?'ถึงกำหนดเปลี่ยน':'เหลือ '+left.toLocaleString('en-US')+' กม.';
 root.querySelector('.cb-phase').textContent=phase;
 }
 slider.oninput=draw;draw();
})();
</script>
</div>
